[package]
name = "gss-sshkey"
version = "0.1.0-alpha.1"
edition = "2021"
build = "build.rs"
license = "BSD-2-Clause"
description = "GSS-API authentication using SSH public keys"

[workspace]
members = ["."]

[lib]
crate-type = ["cdylib"]

[dependencies]
gss-mech-builder = { path = "../gss-mech-builder" }
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "dnssec-ring",
    "system-config",
    "tokio",
] }
hmac = "0.12"
libc = "0.2"
rasn = "0.27.3"
sha1 = "0.10"
sha2 = "0.10"
signature = "2"
ssh-config = { path = "../ssh-config" }
ssh-key = { version = "0.6.7", features = ["crypto"] }
subtle = "2.6"
tokio = { version = "1", features = ["rt", "time"] }
zeroize = "1.8"

[build-dependencies]
rasn-compiler = "0.16.0"

[dev-dependencies]
gss-mech-builder = { path = "../gss-mech-builder", features = [
    "test-harness",
] }
rsa = { version = "0.9", features = ["sha2"] }
